services:
  bot:
    build: .
    image: refgift-bot
    container_name: refgift-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"   # для своего nginx/Caddy на хосте; наружу не открыт
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS для мини-аппа «Рулетка»: docker compose --profile https up -d
  # Нужны DOMAIN (домен, указывающий на сервер) и WEBAPP_URL=https://<DOMAIN> в .env, открытые порты 80 и 443.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro   # CADDYFILE=./Caddyfile.cloudflare — за прокси Cloudflare
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

  # Cloudflare Tunnel — HTTPS без открытых портов и сертификатов: docker compose --profile tunnel up -d
  # Нужен TUNNEL_TOKEN в .env; в панели Cloudflare у туннеля Public Hostname → Service: http://bot:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - bot

volumes:
  bot-data:
  caddy-data:
  caddy-config:
