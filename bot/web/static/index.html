<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Рулетка подарков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js" defer></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="star-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F29D1B"/>
    </linearGradient>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path fill="url(#star-grad)" d="M12 1.5c.5 0 .9.3 1.1.8l1.9 5.1c.2.5.6.9 1.1 1.1l5.1 1.9c1 .4 1 1.8 0 2.2l-5.1 1.9c-.5.2-.9.6-1.1 1.1l-1.9 5.1c-.4 1-1.8 1-2.2 0l-1.9-5.1c-.2-.5-.6-.9-1.1-1.1l-5.1-1.9c-1-.4-1-1.8 0-2.2l5.1-1.9c.5-.2.9-.6 1.1-1.1l1.9-5.1c.2-.5.6-.8 1.1-.8z"/>
    </symbol>
    <symbol id="i-top" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></g><g fill="currentColor"><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="8.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="8.5" cy="15.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/></g></symbol>
    <symbol id="i-profile" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></g></symbol>
  </defs>
</svg>

<div id="app">
  <!-- Играть -->
  <section class="screen active" id="screen-play">
    <div class="segmented" id="cases" role="tablist"></div>

    <div class="card roulette-card">
      <div class="roulette" id="roulette">
        <div class="strip" id="strip"></div>
        <div class="marker"><i class="tri top"></i><i class="line"></i><i class="tri bottom"></i></div>
        <div class="fade left"></div><div class="fade right"></div>
      </div>
      <label class="row switch-row" id="demo-row">
        <span>Демо-режим</span>
        <input type="checkbox" id="demo-toggle" class="switch">
      </label>
    </div>

    <button class="big-button" id="spin-button" type="button">
      <span class="label">Мне повезёт!</span>
      <span class="price" id="spin-price"></span>
      <span class="spinner"></span>
    </button>

    <div class="section-head">
      <h2>Можно выиграть…</h2>
      <button class="link" id="nft-link" type="button">NFT?</button>
    </div>
    <div class="card prizes-card"><div class="prizes" id="prizes"></div></div>
  </section>

  <!-- Топ -->
  <section class="screen" id="screen-top">
    <h1 class="title">Топ</h1>
    <div class="segmented" id="top-tabs">
      <button class="seg active" data-tab="recent" type="button">Последние выигрыши</button>
      <button class="seg" data-tab="top" type="button">Топ недели</button>
    </div>
    <div class="card list" id="top-list"></div>
  </section>

  <!-- Профиль -->
  <section class="screen" id="screen-profile">
    <div class="profile-head">
      <div class="avatar" id="avatar"></div>
      <div class="profile-name" id="profile-name"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="section-head"><h2>История</h2></div>
    <div class="card list" id="history"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-screen="top" type="button"><svg><use href="#i-top"/></svg><span>Топ</span></button>
    <button class="tab active" data-screen="play" type="button"><svg><use href="#i-play"/></svg><span>Играть</span></button>
    <button class="tab" data-screen="profile" type="button"><svg><use href="#i-profile"/></svg><span>Профиль</span></button>
  </nav>
</div>

<!-- Нижняя шторка: выигрыш / подписка -->
<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="boot" id="boot"><div class="boot-spinner"></div></div>

<script src="/static/app.js"></script>
</body>
</html>
